<!DOCTYPE html>
<html lang="en-us">
<head>
  <script>
    (function () {
      var GAME_ID = '10-minutes-till-dawn';
      var LS_PREFIX = '__pg_game_' + GAME_ID + '__:';
      var IDB_SUFFIX = '__' + GAME_ID;
      try {
        var nativeLS = window.localStorage;
        var getScopedKeys = function () {
          var keys = [];
          for (var i = 0; i < nativeLS.length; i++) {
            var k = nativeLS.key(i);
            if (k && k.indexOf(LS_PREFIX) === 0) keys.push(k.slice(LS_PREFIX.length));
          }
          return keys;
        };
        var scopedMethods = {
          getItem: function (key) { return nativeLS.getItem(LS_PREFIX + String(key)); },
          setItem: function (key, value) { nativeLS.setItem(LS_PREFIX + String(key), String(value)); },
          removeItem: function (key) { nativeLS.removeItem(LS_PREFIX + String(key)); },
          clear: function () {
            var toDelete = [];
            for (var i = 0; i < nativeLS.length; i++) {
              var k = nativeLS.key(i);
              if (k && k.indexOf(LS_PREFIX) === 0) toDelete.push(k);
            }
            for (var j = 0; j < toDelete.length; j++) nativeLS.removeItem(toDelete[j]);
          },
          key: function (index) {
            var keys = getScopedKeys();
            return index >= 0 && index < keys.length ? keys[index] : null;
          }
        };
        var scopedProxy = new Proxy(scopedMethods, {
          get: function (target, prop) {
            if (prop === 'length') return getScopedKeys().length;
            if (prop in target) return target[prop];
            if (typeof prop === 'symbol') return undefined;
            var val = nativeLS.getItem(LS_PREFIX + String(prop));
            return val === null ? undefined : val;
          },
          set: function (target, prop, value) {
            if (typeof prop === 'symbol') return false;
            nativeLS.setItem(LS_PREFIX + String(prop), String(value));
            return true;
          },
          deleteProperty: function (target, prop) {
            if (typeof prop === 'symbol') return false;
            nativeLS.removeItem(LS_PREFIX + String(prop));
            return true;
          },
          has: function (target, prop) {
            if (typeof prop === 'symbol') return false;
            return prop in target || nativeLS.getItem(LS_PREFIX + String(prop)) !== null;
          },
          ownKeys: function () { return getScopedKeys(); },
          getOwnPropertyDescriptor: function (target, prop) {
            if (typeof prop === 'symbol') return undefined;
            var val = nativeLS.getItem(LS_PREFIX + String(prop));
            return val === null ? undefined : { enumerable: true, configurable: true, writable: true, value: val };
          }
        });
        Object.defineProperty(window, 'localStorage', {
          configurable: true,
          enumerable: true,
          get: function () { return scopedProxy; }
        });
      } catch (e) {}
      try {
        var proto = IDBFactory.prototype;
        var origOpen = proto.open;
        var origDelete = proto.deleteDatabase;
        var scopeDbName = function (name) {
          var str = String(name || '');
          if (!str || str === 'UnityCache' || str.indexOf(IDB_SUFFIX) !== -1) return str;
          return str + IDB_SUFFIX;
        };
        proto.open = function (name, version) {
          var scoped = scopeDbName(name);
          return arguments.length > 1 ? origOpen.call(this, scoped, version) : origOpen.call(this, scoped);
        };
        proto.deleteDatabase = function (name) {
          return origDelete.call(this, scopeDbName(name));
        };
      } catch (e) {}
    })();
  </script>
  <base href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/10minutestilldawn/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>10 Minutes Till Dawn</title>
  <style>
    html, body {
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
      padding: 0;
      margin: 0;
    }
    #loading-text {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      font-size: 16px;
      z-index: 10;
    }
    div#gameContainer {
      background: transparent !important;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    div#gameContainer canvas {
      position: absolute;
      width: 100%;
      height: 100%;
    }
  </style>
  <script src="Build/UnityLoader.js"></script>
  <script>
    function mergeFiles(fileParts) {
      return new Promise((resolve, reject) => {
        let buffers = [];
        function fetchPart(i) {
          if (i >= fileParts.length) {
            resolve(new Blob(buffers));
            return;
          }
          fetch(fileParts[i])
            .then((r) => {
              if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + fileParts[i]);
              return r.arrayBuffer();
            })
            .then((data) => {
              buffers.push(data);
              fetchPart(i + 1);
            })
            .catch(reject);
        }
        fetchPart(0);
      });
    }

    function getParts(file, start, end) {
      let arr = [];
      for (let i = start; i <= end; i++) {
        arr.push(file + '.part' + i);
      }
      return arr;
    }

    function resizeUnityContainer() {
      var container = document.getElementById('gameContainer');
      if (container) {
        container.style.width = window.innerWidth + 'px';
        container.style.height = window.innerHeight + 'px';
      }
    }
    window.addEventListener('resize', resizeUnityContainer);

    function UnityProgress(gameInstance, progress) {
      try {
        if (progress === 'complete') return;
        var pct = 0;
        if (typeof progress === 'number') pct = progress;
        else if (progress && progress.total && progress.loaded) pct = progress.loaded / progress.total;
        var txt = document.getElementById('loading-text');
        if (txt) txt.textContent = 'Loading... ' + Math.round(pct * 100) + '%';
      } catch (e) {}
    }

    window.addEventListener('load', function () {
      resizeUnityContainer();
      window.unityMergedFiles = {};
      Promise.all([
        mergeFiles(getParts('Build/10MinutesTillDawnWebGL.data.unityweb', 1, 2)),
        mergeFiles(getParts('Build/10MinutesTillDawnWebGL.wasm.code.unityweb', 1, 2)),
        mergeFiles(getParts('Build/10MinutesTillDawnWebGL.wasm.framework.unityweb', 1, 1))
      ]).then(([dataBlob, wasmCodeBlob, wasmFrameworkBlob]) => {
        window.unityMergedFiles['Build/10MinutesTillDawnWebGL.data.unityweb'] = URL.createObjectURL(dataBlob);
        window.unityMergedFiles['Build/10MinutesTillDawnWebGL.wasm.code.unityweb'] = URL.createObjectURL(wasmCodeBlob);
        window.unityMergedFiles['Build/10MinutesTillDawnWebGL.wasm.framework.unityweb'] = URL.createObjectURL(wasmFrameworkBlob);

        function findMergedKey(requestUrl) {
          try {
            if (typeof requestUrl !== 'string') return null;
            if (window.unityMergedFiles[requestUrl]) return requestUrl;
            var resolved = new URL(requestUrl, window.location.href).pathname.replace(/^[\\/]+/, '');
            if (window.unityMergedFiles[resolved]) return resolved;
            var withBuild = 'Build/' + resolved.split('/').pop();
            if (window.unityMergedFiles[withBuild]) return withBuild;
          } catch (e) {}
          return null;
        }

        const originalFetch = window.fetch.bind(window);
        window.fetch = function (url, ...args) {
          const key = findMergedKey(url);
          if (key) return originalFetch(window.unityMergedFiles[key], ...args);
          return originalFetch(url, ...args);
        };

        const OriginalXHR = window.XMLHttpRequest;
        window.XMLHttpRequest = function () {
          const xhr = new OriginalXHR();
          const originalOpen = xhr.open;
          xhr.open = function (method, url, ...args) {
            try {
              const key = findMergedKey(url);
              if (key) return originalOpen.call(this, method, window.unityMergedFiles[key], ...args);
            } catch (e) {}
            return originalOpen.call(this, method, url, ...args);
          };
          return xhr;
        };

        window.gameInstance = UnityLoader.instantiate('gameContainer', 'Build/10MinutesTillDawnWebGL.json', {
          onProgress: UnityProgress,
          Module: {
            onRuntimeInitialized: function () {
              resizeUnityContainer();
              let loadingText = document.querySelector('#loading-text');
              if (loadingText) loadingText.remove();
              UnityProgress(window.gameInstance, 'complete');
            }
          }
        });
      }).catch((err) => {
        let txt = document.getElementById('loading-text');
        if (txt) txt.textContent = 'Loading failed: ' + (err && err.message ? err.message : err);
      });
    });
  </script>
</head>
<body>
  <div id="loading-text">Loading... 0%</div>
  <div id="gameContainer" data-pixelated="true"></div>
</body>
</html>
